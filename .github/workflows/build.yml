name: Build Subu5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Subu5 ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show system
        run: |
          uname -a
          lsb_release -a
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            livecd-rootfs \
            live-build \
            xorriso \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            shim-signed \
            mtools \
            dosfstools \
            rsync \
            debootstrap \
            genisoimage \
            qemu-utils

      - name: Build Subu5
        run: |
          chmod +x scripts/build.sh
          sudo ./scripts/build.sh

      - name: Verify ISO
        run: |
          test -f output/Subu5-noble-amd64.iso

          echo "ISO generated successfully:"
          ls -lh output/Subu5-noble-amd64.iso

          echo "SHA256:"
          sha256sum output/Subu5-noble-amd64.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Subu5-noble-amd64
          path: output/Subu5-noble-amd64.iso
          if-no-files-found: error
